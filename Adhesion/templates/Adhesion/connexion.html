{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DigiCol - Connexion</title>
    <link rel="stylesheet" href="{%  static 'css/output.css' %}">

    <script
        src="https://unpkg.com/lucide@latest"
    ></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-10">
            <!-- TITRE -->
            <div class="text-center mb-8">
                <div class="mx-auto mb-4 w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="log-in" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900">
                    Bienvenue sur
                    <span class="text-blue-600">
                        DigiCol
                    </span>
                </h1>

                <p class="text-xs text-slate-500 mt-2">
                    Connectez-vous à votre compte pour continuer.
                </p>
            </div>

            <!-- MESSAGES -->
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 p-3 rounded-xl text-xs
                        {% if message.tags == 'error' %}
                            bg-red-50 text-red-600 border border-red-200
                        {% else %}
                            bg-green-50 text-green-600 border border-green-200
                        {% endif %}
                    ">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}


            <!-- FORMULAIRE -->

            <form
                method="POST"
                action="{% url 'connexion' %}"
                class="space-y-5"
            >

                {% csrf_token %}


                <!-- EMAIL -->

                <div>

                    <label
                        for="email"
                        class="block text-xs font-semibold text-slate-700 mb-1"
                    >
                        Adresse Email
                    </label>


                    <div class="relative">

                        <i
                            data-lucide="mail"
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
                        ></i>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="exemple@gmail.com"
                            required
                            class="w-full pl-10 pr-3.5 py-3 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
                        >

                    </div>

                </div>


                <!-- MOT DE PASSE -->

                <div>

                    <label
                        for="password"
                        class="block text-xs font-semibold text-slate-700 mb-1"
                    >
                        Mot de passe
                    </label>


                    <div class="relative">

                        <i
                            data-lucide="lock"
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
                        ></i>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            class="w-full pl-10 pr-3.5 py-3 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
                        >

                    </div>

                </div>


                <!-- BOUTON -->

                <button
                    type="submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2"
                >

                    <i
                        data-lucide="log-in"
                        class="w-4 h-4"
                    ></i>

                    Se connecter

                </button>


            </form>


            <!-- INSCRIPTION -->

            <p class="text-center text-xs text-slate-500 mt-6">

                Vous n'avez pas encore de compte ?

                <a
                    href="{% url 'Adhesion' %}"
                    class="text-blue-600 font-bold hover:underline"
                >
                    Créer un compte
                </a>

            </p>


        </div>

    </div>


    <!-- Initialisation Lucide -->

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
