<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiCol - Rejoint la communauté</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-8 font-sans">


    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-10 space-y-8">
    

        <div class="text-center space-y-2">
            <h1 class="text-2xl font-extrabold text-slate-900">
                Rejoignez <span class="text-blue-600">DigiCol</span>
            </h1>
            <p class="text-xs text-slate-500">
                Remplissez ce formulaire pour créer votre compte et accéder à la plateforme.
            </p>
        </div>


      <form class="space-y-6">

      <!-- SECTION 1 : COMPTE ET IDENTIFIANTS -->
      <div class="space-y-4">
        <h2 class="text-xs font-bold text-blue-900 uppercase tracking-wider border-b border-slate-100 pb-2">
          1. Identifiants de connexion
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="fullname" class="block text-xs font-semibold text-slate-700 mb-1">Nom complet</label>
            <input type="text" id="fullname" name="fullname" placeholder="Ex: Jean Dupont" required
                   class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
          </div>


          <div>
            <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Adresse Email</label>
            <input type="email" id="email" name="email" placeholder="exemple@gmail.com" required
                   class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
          </div>


          <div>
            <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required
                   class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
          </div>


          <div>
            <label for="confirm_password" class="block text-xs font-semibold text-slate-700 mb-1">Confirmer le mot de passe</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required
                   class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
          </div>
        </div>
      </div>



      <!-- SECTION 2 : INFORMATIONS COMPLÉMENTAIRES -->
      <div class="space-y-4">
        <h2 class="text-xs font-bold text-blue-900 uppercase tracking-wider border-b border-slate-100 pb-2">
          2. Profil & Coordonnées
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

            <div>
            <label for="phone" class="block text-xs font-semibold text-slate-700 mb-1">Téléphone / WhatsApp</label>
            <input type="tel" id="phone" name="phone" placeholder="6XX XXX XXX" required
                   class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
          </div>


          <div>
            <label for="city" class="block text-xs font-semibold text-slate-700 mb-1">Ville</label>
            <select id="city" name="city" required
                    class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 bg-white text-slate-700 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
              <option value="">Sélectionner une ville</option>
              <option value="douala">Douala</option>
              <option value="yaounde">Yaoundé</option>
              <option value="autre">Autre</option>
            </select>
          </div>


          <div class="sm:col-span-2">
            <label for="domain" class="block text-xs font-semibold text-slate-700 mb-1">Domaine d'intérêt principal</label>
            <select id="domain" name="domain" required
                    class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 bg-white text-slate-700 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
              <option value="">Sélectionner un domaine</option>
              <option value="web">Développement Web & Mobile</option>
              <option value="data">Data Science & Intelligence Artificielle</option>
              <option value="networks">Réseaux & Sécurité</option>
              <option value="design">Design UI/UX</option>
            </select>
          </div>
        </div>
      </div>


      <div class="flex items-center gap-2 pt-2">
        <input type="checkbox" id="terms" required class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4 border-slate-300">
        <label for="terms" class="text-xs text-slate-600">
          J'accepte les conditions d'utilisation et la politique de confidentialité de DigiCol.
        </label>
      </div>




      <div>
        <button type="submit" 
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md hover:shadow-lg transition">
          S'inscrire
        </button>
      </div>


      <p class="text-center text-xs text-slate-500 pt-2">
        Vous avez déjà un compte ? 
        <a href="#" class="text-blue-600 font-bold hover:underline">Se connecter</a>
      </p>

    </form>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
